name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir -p www
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do [ -f "$f" ] && cp -n "$f" www/ || true; done
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          ls capacitor.config.* >/dev/null 2>&1 || npx cap init Salati app.salati.shop --web-dir www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: salati-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
