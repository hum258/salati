<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a26">
<title>سلّتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f0;--card:#fff;--ink:#12262b;--mute:#5d7076;--acc:#0e7c66;--soft:#d5ece5;--gold:#c98a0b;--line:#d6e0dc;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1d;--card:#16282c;--ink:#e8f1ee;--mute:#9ab0b5;--acc:#3fc3a4;--soft:#1c3a36;--gold:#f2b134;--line:#26414a}}
:root[data-theme="dark"]{--bg:#0e1a1d;--card:#16282c;--ink:#e8f1ee;--mute:#9ab0b5;--acc:#3fc3a4;--soft:#1c3a36;--gold:#f2b134;--line:#26414a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-size:18px;line-height:1.7;color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;background:radial-gradient(circle at 12% 8%,rgba(242,177,52,.2),transparent 42%),radial-gradient(circle at 92% 30%,rgba(14,124,102,.22),transparent 46%),var(--bg);background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:14px 16px 110px}
h1{font-size:25px;font-weight:800;margin:4px 0}h2{font-size:18px;margin:16px 0 8px}p{margin:0 0 8px}
header{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.mute{color:var(--mute);font-size:15px}.gold{color:var(--gold);font-weight:800}
.box,.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer}.row.sel{border:2px solid var(--acc);background:var(--soft)}
.cs{font-size:26px;min-width:46px;text-align:center}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;min-height:50px;padding:9px 16px;font:inherit;font-size:17px;font-weight:600;cursor:pointer}.btn.alt{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.back{background:none;border:0;color:var(--acc);font:inherit;font-size:22px;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:17px;min-height:48px;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:3px 0;max-width:100%}input.w{width:100%}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.fl>*{flex:1;min-width:90px}
.hero{background:linear-gradient(135deg,#0e7c66,#2bb08f);color:#fff;border-radius:18px;padding:16px;margin:8px 0 12px}.hero h1{margin:0}
.hero .btn{background:#fff;color:#0e7c66}.hero input{width:auto;flex:none}
.stats{display:flex;justify-content:space-between}.stats b{display:block;font-size:22px}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#f2b134}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}.chip{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:7px 12px;font:inherit;font-size:15px;cursor:pointer}.chip.on{background:var(--soft);font-weight:800}
.cat{font-weight:800;margin:14px 0 6px;color:var(--cc)}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--cc);border-radius:12px;padding:10px;margin-bottom:6px}.it .nm{flex:1}.it.dn .nm{opacity:.6}
.ck{width:42px;height:42px;border-radius:50%;border:2px solid var(--acc);background:none;color:#fff;font-size:22px;cursor:pointer;flex:none}.dn .ck{background:var(--acc)}
.x{background:none;border:0;color:var(--mute);font-size:21px;min-width:42px;min-height:42px;cursor:pointer}
.rep{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:360px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0b2a26;color:#f2b134;padding:10px 14px;border-radius:14px;z-index:70;font-weight:800}
.toast button{background:#f2b134;color:#0b2a26;border:0;border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:15px;padding:12px 0;cursor:pointer}nav button.on{color:var(--acc);font-weight:800}nav span{display:block;font-size:30px}
.tag{background:var(--gold);color:#fff;border-radius:8px;padding:0 8px;font-size:14px}.pbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:var(--acc)}
.shop{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 40px}.shop .stats{align-items:center;margin-bottom:12px}.big{display:flex;gap:16px;align-items:center;width:100%;min-height:84px;margin-bottom:10px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px;font:inherit;font-size:24px;color:var(--ink);text-align:start;cursor:pointer}.bc{width:54px;height:54px;border-radius:50%;border:3px solid var(--acc);flex:none}.big small{font-size:15px;color:var(--mute)}
html.eye:root{--bg:#0c1416;--card:#162326;--ink:#fff;--mute:#cfdde0;--acc:#5be0c0;--soft:#1f3c38;--gold:#ffd166;--line:#5a747b}html.eye body{font-size:21px;background:var(--bg)}html.eye .btn,html.eye .ck{color:#06201b}html.eye .btn.alt{color:var(--acc)}html.eye .hero .btn{color:#0e7c66}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#splash{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 35%,#14594b,#0b2a26 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}#splash h1{font-size:44px}#splash.off{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){#splash svg{animation:pop 1.1s ease-out}@keyframes pop{from{transform:scale(.3) rotate(-100deg);opacity:0}to{transform:none;opacity:1}}}
:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
</style>
<link rel="manifest" href="manifest.webmanifest">

<body>
<div id="splash"><svg width="88" height="88" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="42" fill="none" stroke="#f2b134" stroke-width="5"/><path d="M24 32h8l6 26h26l5-18H36M42 70a3 3 0 1 0 .1 0M62 70a3 3 0 1 0 .1 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>سلّتي</h1><p style="color:#f2b134;margin:0">اشترِ أذكى، ووفّر أكثر</p></div>

<nav id="nav"></nav>
<script>
const $=i=>document.getElementById(i),app=$("app"),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=[["veg","🥬","خضار وفواكه|Produce","#2e9e5b"],["meat","🍗","لحوم ودواجن|Meat","#d9534f"],["dairy","🥛","ألبان وأجبان|Dairy","#4aa3df"],["bread","🍞","مخبوزات|Bakery","#d9902f"],["dry","🥫","معلبات وجافة|Pantry","#8e6bbf"],["drink","🧃","مشروبات|Drinks","#17a2b8"],["clean","🧼","منظفات|Cleaning","#3b8ed0"],["care","🧴","عناية شخصية|Care","#e0719b"],["other","🛒","أخرى|Other","#7f8c8d"]];
const CUR={SYP:["ل.س","الليرة السورية|Syrian pound"],USD:["$","الدولار|US dollar"],EUR:["€","اليورو|Euro"],TRY:["₺","الليرة التركية|Turkish lira"],SAR:["ر.س","الريال السعودي|Saudi riyal"],AED:["د.إ","الدرهم الإماراتي|UAE dirham"]};
const KW={veg:"خيار بندورة طماطم بطاطا بصل ثوم تفاح موز برتقال ليمون خس جزر فلفل باذنجان كوسا فواكه خضار زيتون",meat:"لحم دجاج فروج سمك كبدة برغر مرتديلا سجق",dairy:"حليب لبن جبن قشطة زبدة بيض لبنة",bread:"خبز صمون كعك معجنات كرواسون",dry:"رز أرز سكر برغل عدس حمص معلب زيت سمنة معكرونة طحين شاي قهوة ملح بهار",drink:"عصير ماء مياه مشروب كولا بيبسي",clean:"صابون منظف جلي مسحوق كلور منعم",care:"معجون فرشاة شامبو كريم عطر مزيل"};
const S={app:"سلّتي|Salati",newList:"قائمة جديدة|New list",listPh:"مثلاً: مشتريات السبت|e.g. Saturday groceries",create:"＋ إنشاء|＋ Create",lists:"قوائمي|Lists",reports:"التقارير|Reports",prices:"الأسعار|Prices",bought:"تم شراؤه ✓|Bought ✓",remaining:"المتبقي|Left",spent:"المصروف|Spent",addItem:"➕ أضف منتج|➕ Add item",itemPh:"مثلاً: خبز، بندورة|e.g. bread, tomatoes",add:"＋ إضافة|＋ Add",auto:"✨ تلقائي|✨ Auto",card:"🧾 البطاقة|🧾 Card",dup:"⧉ تكرار|⧉ Copy",copy:"نسخة|copy",copied:"تم نسخ القائمة ✓|List copied ✓",save:"حفظ ✓|Save ✓",skip:"تخطّي|Skip",close:"إغلاق|Close",price:"كم دفعت؟|How much?",store:"المحل (اختياري)|Store (optional)",last:"آخر سعر|Last price",undo:"تراجع|Undo",deleted:"تم الحذف|Deleted",total:"المجموع|Total",date:"📅 التاريخ|📅 Date",today:"اليوم|Today",week:"آخر 7 أيام|Last 7 days",month:"هذا الشهر|This month",dl:"💾 حفظ كصورة|💾 Save image",shr:"📤 مشاركة|📤 Share",hold:"أو اضغط مطولاً على الصورة لحفظها|Or long-press the image to save it",curr:"العملة|Currency",rates:"أسعار الصرف (اختياري)|Exchange rates (optional)",ratesHelp:"كم وحدة تساوي 1 دولار؟ تلزم فقط لمقارنة عملات مختلفة.|How many units per 1 USD? Only needed to compare different currencies.",done:"متابعة ✓|Continue ✓",hello:"اختر لغتك وعملتك|Choose language and currency",empty1:"القائمة فاضية. اكتب منتجاً واضغط إضافة.|The list is empty. Type an item and tap Add.",tip:"👆 اضغط الدائرة لما تشتري المنتج|👆 Tap the circle when you buy an item",help:"1️⃣ أنشئ قائمة 2️⃣ أضف المنتجات 3️⃣ اضغط الدائرة لما تشتري|1️⃣ Create a list 2️⃣ Add items 3️⃣ Tap the circle when bought",cheapest:"الأرخص|Cheapest",noPrices:"ما في أسعار بعد.|No prices yet.",saved:"تم ✓|Saved ✓",finish:"✨ خلّصت القائمة|✨ List complete",back2:"رجع للمتبقي|Moved back",repNote:"الأرقام حسب تاريخ كل قائمة وبعملتك الأساسية.|Based on each list date, in your main currency.",export:"⬇️ تصدير|⬇️ Export",expPng:"بطاقة أنيقة كصورة|Neat card as an image",expPdf:"للطباعة والحفظ|For printing and keeping",expXls:"جدول يفتح في Excel|A table that opens in Excel",tomorrow:"غداً|Tomorrow",shop:"🛍️ ابدأ التسوّق|🛍️ Start shopping",tpl:"قوالب سريعة:|Quick templates:",set:"الإعدادات|Settings",noMic:"الإدخال الصوتي غير مدعوم هنا|Voice input is not supported here",listen:"🎤 تكلّم الآن...|🎤 Speak now...",added:"تمت الإضافة ✓|Added ✓",bk:"💾 نسخة احتياطية|💾 Backup",bkSave:"حفظ نسخة|Save backup",bkRest:"استعادة نسخة|Restore backup",restored:"تمت الاستعادة ✓|Restored ✓",badFile:"الملف غير صالح|Invalid file",bkNote:"ملف واحد بدون حساب. احتفظ به بمكان آمن.|One file, no account. Keep it somewhere safe.",wSub:"اشترِ أذكى، ووفّر أكثر|Shop smarter, save more",w1:"قوائم ذكية بأقسام وألوان|Smart, colour-coded lists",w2:"يتذكّر آخر سعر ويقارنه لك|Remembers prices and compares them",w3:"تصدير ومشاركة بضغطة|Export and share in one tap",start:"ابدأ ✨|Start ✨"};
let D={lists:[],items:[],set:{lang:"ar",base:"SYP",rates:{USD:1}}},V={t:"lists"},U=null,P=[];
try{const s=JSON.parse(localStorage.getItem("salati")||"null");if(s){D=Object.assign(D,s);D.set=Object.assign({lang:"ar",base:"SYP",rates:{USD:1}},s.set)}}catch(e){}
const save=()=>{try{localStorage.setItem("salati",JSON.stringify(D))}catch(e){}};
const en=()=>D.set.lang==="en",t=k=>S[k].split("|")[+en()],nm=s=>s.split("|")[+en()];
const A=a=>a.filter(x=>!x.d),find=(a,id)=>a.find(x=>x.id===id),ldt=id=>find(D.lists,id)?.dt||"";
const live=()=>A(D.items).filter(i=>!find(D.lists,i.l)?.d),items=l=>A(D.items).filter(i=>i.l===l);
const fmt=(a,c)=>(+a).toLocaleString("en-US",{maximumFractionDigits:2})+" "+CUR[c][0];
const conv=(a,c,to)=>c===to?a:(D.set.rates[c]&&D.set.rates[to]?a/D.set.rates[c]*D.set.rates[to]:null);
const sum=a=>a.reduce((s,i)=>s+(i.pr?conv(i.pr,i.pc,D.set.base)||0:0),0);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),today=()=>ymd(new Date());
const lastP=(n,ex)=>live().filter(i=>i.pr&&i.id!==ex&&i.n.trim()===n.trim()).sort((a,b)=>ldt(b.l).localeCompare(ldt(a.l))||b.u-a.u)[0];
const guess=n=>(CATS.slice(0,8).find(c=>KW[c[0]].split(" ").some(w=>n.includes(w)))||CATS[8])[0];
/* حفظ تلقائي + تراجع: كل تغيير يمر من act */
const act=(fn,msg)=>{U=JSON.stringify(D);fn();save();draw();if(msg)toast(msg,1)};
const undo=()=>{if(U){D=JSON.parse(U);U=null;save();draw()}};
/* تأثيرات */
const cv=$("fx"),cx=cv.getContext("2d"),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();addEventListener("resize",rs);
function burst(x,y,n){if(RM)return;const run=!P.length;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=2+Math.random()*5;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,c:["#f2b134","#3fc3a4","#fff","#0e7c66"][i%4],s:2+Math.random()*3})}if(run)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.016;if(p.l<=0)return false;cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.28);cx.fill();return true});P.length?requestAnimationFrame(tick):cx.clearRect(0,0,cv.width,cv.height)}
function toast(m,u){const d=document.createElement("div");d.className="toast";d.innerHTML="<span>"+esc(m)+"</span>"+(u&&U?`<button onclick="undo();this.parentNode.remove()">${t("undo")}</button>`:"");document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
/* الشاشات */
const go=(k,id)=>{V.t=k;V.id=id||null;V.sheet=V.img=V.shop=V.exp=null;draw();scrollTo(0,0)};
function draw(){
 document.documentElement.dir=en()?"ltr":"rtl";document.documentElement.lang=D.set.lang;document.documentElement.classList.toggle("eye",!!D.set.eye);
 if(!D.set.init&&!D.set.welcomed){$("nav").style.display="none";app.innerHTML=welcomeV();return}
 const setup=!D.set.init||V.t==="set";
 $("nav").style.display=D.set.init?"":"none";
 $("nav").innerHTML=[["lists","🛒"],["reports","📊"],["prices","🏷️"],["set","⚙️"]].map(([k,e])=>`<button class="${V.t===k?"on":""}" onclick="go('${k}')"><span>${e}</span>${t(k)}</button>`).join("");
 app.innerHTML=`<header><b>🛒 ${t("app")}</b>${D.set.init?`<button class="x" onclick="D.set.eye=!D.set.eye;save();draw()" aria-label="eye comfort">👁️</button>`:""}</header>`+(setup?setupV():V.id?listV(V.id):{lists:listsV,reports:repV,prices:priV}[V.t]())+(V.shop?shopV():"")+(V.sheet?sheetV():"")+(V.img?cardV():"")+(V.exp?expV():"");
}
const setRate=(c,v)=>{v=parseFloat(v);v>0?D.set.rates[c]=v:delete D.set.rates[c];D.set.rates.USD=1;save()};
const setupV=()=>`<div class="hero"><h1>${t("hello")}</h1></div><div class="fl">${[["ar","العربية"],["en","English"]].map(([c,n])=>`<button class="btn${D.set.lang===c?"":" alt"}" onclick="D.set.lang='${c}';save();draw()">${n}</button>`).join("")}</div><h2>${t("curr")}</h2>${["SYP","USD","EUR","TRY","SAR","AED"].map((c,i)=>`<button class="row${D.set.base===c?" sel":""}" onclick="D.set.base='${c}';save();draw()" style="${i<2?"font-weight:800":""}"><span class="cs">${CUR[c][0]}</span>${nm(CUR[c][1])}</button>`).join("")}<details class="box"><summary><b>${t("rates")}</b></summary><p class="mute">${t("ratesHelp")}</p>${Object.keys(CUR).filter(c=>c!=="USD").map(c=>`<div class="fl"><span style="flex:none">1$ =</span><input type="number" step="any" value="${D.set.rates[c]||""}" onchange="setRate('${c}',this.value)"><span style="flex:none">${nm(CUR[c][1])}</span></div>`).join("")}</details>${D.set.init?bkV():""}<button class="btn" style="width:100%" onclick="D.set.init=1;save();go('lists')">${t("done")}</button>`;
const listsV=()=>{const L=A(D.lists).sort((a,b)=>(b.dt||"").localeCompare(a.dt||""));return `<div class="box"><b>${t("newList")}</b><div class="fl"><input id="ln" placeholder="${t("listPh")}" onkeydown="event.key==='Enter'&&addList()"><button class="btn" style="flex:none" onclick="addList()">${t("create")}</button></div><div class="mute">${t("tpl")}</div><div class="chips">${TPL.map((p,i)=>`<button class="chip" onclick="tpl(${i})">${p[0]} ${nm(p[1])}</button>`).join("")}</div></div>`+L.map(l=>{const it=items(l.id),dn=it.filter(i=>i.k).length,pct=it.length?Math.round(dn/it.length*100):0;return `<div class="row" onclick="go('lists','${l.id}')"><span style="flex:1"><b>${esc(l.n)}</b><br><span class="mute">📅 ${l.dt||""}${dayTag(l.dt)} – ${dn}/${it.length} (${pct}%)</span><div class="pbar"><i style="width:${pct}%"></i></div></span><button class="x" onclick="event.stopPropagation();dup('${l.id}')" aria-label="copy">⧉</button><button class="x" onclick="event.stopPropagation();delList('${l.id}')" aria-label="delete">🗑️</button></div>`}).join("")+(L.length?"":`<div class="box">${t("help")}</div>`)};
const addList=()=>{const n=$("ln").value.trim();if(!n)return;const id=uid();act(()=>D.lists.push({id,n,dt:today(),u:Date.now()}));go("lists",id)};
const delList=id=>act(()=>{find(D.lists,id).d=1},t("deleted"));
const dup=id=>{const l=find(D.lists,id),n=uid();act(()=>{D.lists.push({id:n,n:l.n+" ("+t("copy")+")",dt:today(),u:Date.now()});items(id).forEach(i=>D.items.push({id:uid(),l:n,n:i.n,q:i.q,c:i.c,k:0,u:Date.now()}))});toast(t("copied"),1)};
const setDt=(id,v)=>{find(D.lists,id).dt=v||today();save();draw()};
const setCat=c=>{V.cat=c||null;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",(b.dataset.c||"")===(c||"")))};
const addIt=l=>{const n=$("in").value.trim();if(!n)return;const c=V.cat||guess(n),q=Math.max(1,+$("iq").value||1);V.cat=null;act(()=>D.items.push({id:uid(),l,n,q,c,k:0,u:Date.now()}));$("in")?.focus()};
const delIt=id=>act(()=>{find(D.items,id).d=1},t("deleted"));
const unbuy=id=>act(()=>{const i=find(D.items,id);i.k=0;i.u=Date.now()},t("back2"));
const buy=id=>{const i=find(D.items,id),a=parseFloat($("pa")?.value),p=$("pc")?.value,s=$("ps")?.value.trim();
 act(()=>{V.sheet=null;i.k=1;i.u=Date.now();if(a>0)Object.assign(i,{pr:a,pc:p,st:s})},t("saved"));
 burst(innerWidth/2,innerHeight*.6,30);if(items(i.l).every(x=>x.k)){burst(innerWidth/2,innerHeight/3,110);toast(t("finish"),1)}};
const rowV=i=>{const lp=!i.pr&&lastP(i.n,i.id),col=(CATS.find(c=>c[0]===i.c)||CATS[8])[3];
 return `<div class="it${i.k?" dn":""}" style="--cc:${col}"><button class="ck" onclick="${i.k?`unbuy('${i.id}')`:`V.sheet='${i.id}';draw()`}" aria-label="bought">${i.k?"✓":""}</button><span class="nm"${i.k?` onclick="V.sheet='${i.id}';draw()"`:""}>${esc(i.n)}${i.q>1?" ×"+i.q:""}<br><span class="mute">${i.pr?"💰 "+fmt(i.pr,i.pc)+(i.st?" – "+esc(i.st):"")+" "+diff(i):lp?t("last")+": "+fmt(lp.pr,lp.pc)+(lp.st?" – "+esc(lp.st):""):""}</span></span><button class="x" onclick="delIt('${i.id}')" aria-label="delete">✕</button></div>`};
const listV=id=>{const l=find(D.lists,id),it=items(id),open=it.filter(i=>!i.k),got=it.filter(i=>i.k);
 return `<button class="back" onclick="go('lists')">${en()?"←":"→"}</button><h1>${esc(l.n)}</h1>
<div class="hero"><div class="stats"><span>${t("remaining")}<b>${open.length}</b></span><span>${t("spent")}<b>${fmt(sum(got),D.set.base)}</b></span></div><div class="bar"><i style="width:${it.length?got.length/it.length*100:0}%"></i></div><div class="fl" style="margin-bottom:8px"><span style="flex:none">${t("date")}</span><input type="date" value="${l.dt||today()}" onchange="setDt('${id}',this.value)"></div><div class="fl"><button class="btn" onclick="V.shop='${id}';draw()">${t("shop")}</button><button class="btn" onclick="V.exp='${id}';draw()">${t("export")}</button><button class="btn" onclick="dup('${id}')">${t("dup")}</button></div></div>
<div class="box"><b>${t("addItem")}</b><div class="fl"><input id="in" placeholder="${t("itemPh")}" onkeydown="event.key==='Enter'&&addIt('${id}')"><input id="iq" type="number" min="1" value="1" style="max-width:80px;flex:none"><button class="btn" style="flex:none" onclick="mic('${id}')" aria-label="voice">🎤</button></div><div class="chips"><button class="chip${V.cat?"":" on"}" data-c="" onclick="setCat('')">${t("auto")}</button>${CATS.map(c=>`<button class="chip${V.cat===c[0]?" on":""}" data-c="${c[0]}" onclick="setCat('${c[0]}')" style="border-color:${c[3]}">${c[1]} ${nm(c[2])}</button>`).join("")}</div><button class="btn" style="width:100%" onclick="addIt('${id}')">${t("add")}</button></div>`
 +(it.length?"":`<p class="mute">${t("empty1")}</p>`)+(it.length&&!got.length?`<p class="mute">${t("tip")}</p>`:"")
 +CATS.map(c=>{const g=open.filter(i=>i.c===c[0]);return g.length?`<div class="cat" style="--cc:${c[3]}">${c[1]} ${nm(c[2])}</div>`+g.map(rowV).join(""):""}).join("")
 +(got.length?`<div class="cat" style="--cc:var(--acc)">${t("bought")}</div>`+got.map(rowV).join(""):"")};
const sheetV=()=>{const i=find(D.items,V.sheet),lp=lastP(i.n,i.id),st=[...new Set(live().map(x=>x.st).filter(Boolean))];
 return `<div class="ov" onclick="if(event.target===this){V.sheet=null;draw()}"><div class="sheet"><b>${esc(i.n)}</b>${lp?`<div class="gold">${t("last")}: ${fmt(lp.pr,lp.pc)}${lp.st?" – "+esc(lp.st):""}</div>`:""}<div class="fl"><input id="pa" type="number" inputmode="decimal" step="any" placeholder="${t("price")}" value="${i.pr||""}" oninput="pd('${i.id}')"><select id="pc" onchange="pd('${i.id}')">${Object.keys(CUR).map(c=>`<option value="${c}"${c===(i.pc||D.set.base)?" selected":""}>${CUR[c][0]} ${c}</option>`).join("")}</select></div><div id="pd">${diff(i)}</div><input class="w" id="ps" list="sn" placeholder="${t("store")}" value="${esc(i.st||"")}"><datalist id="sn">${st.map(s=>`<option value="${esc(s)}">`).join("")}</datalist><div class="fl"><button class="btn" onclick="buy('${i.id}')">${t("save")}</button><button class="btn alt" onclick="${i.k?"V.sheet=null;draw()":`buy('${i.id}')`}">${i.k?t("close"):t("skip")}</button></div></div></div>`};
const repV=()=>{const T=today(),W=ymd(new Date(Date.now()-6*864e5)),f=p=>sum(live().filter(i=>i.pr&&p(ldt(i.l))));
 return `<h1>📊 ${t("reports")}</h1>`+[["today",x=>x===T],["week",x=>x>=W&&x<=T],["month",x=>x.slice(0,7)===T.slice(0,7)]].map(([k,p])=>`<div class="box rep"><span>${t(k)}</span><b>${fmt(f(p),D.set.base)}</b></div>`).join("")+`<p class="mute">${t("repNote")}</p>`};
const priV=()=>{const g={};live().filter(i=>i.pr).forEach(i=>(g[i.n.trim()]??=[]).push(i));
 return `<h1>🏷️ ${t("prices")}</h1>`+(Object.keys(g).sort().map(n=>{const l=lastP(n),b=g[n].filter(i=>i.st).map(i=>({s:i.st,v:conv(i.pr,i.pc,D.set.base)})).filter(x=>x.v!==null).sort((x,y)=>x.v-y.v)[0];
 return `<div class="box"><b>${esc(n)}</b><br><span class="mute">${t("last")}: ${fmt(l.pr,l.pc)}${l.st?" – "+esc(l.st):""}</span>${b?`<br><span class="gold">${t("cheapest")}: ${esc(b.s)} (${fmt(b.v,D.set.base)})</span>`:""}</div>`}).join("")||`<p class="mute">${t("noPrices")}</p>`)};
/* بطاقة القائمة كصورة PNG */
const mk=id=>{const l=find(D.lists,id),it=items(id),rtl=!en(),W=720,rows=[];
 CATS.forEach(c=>{const g=it.filter(i=>i.c===c[0]);if(g.length){rows.push([1,c]);g.forEach(i=>rows.push([0,i]))}});
 const c=document.createElement("canvas");c.width=W;c.height=200+rows.reduce((s,r)=>s+(r[0]?60:46),0)+110;
 const x=c.getContext("2d"),R=rtl?W-34:34,E=rtl?34:W-34,F="Cairo,Tahoma,Arial,sans-serif",gr=x.createLinearGradient(0,0,W,150);
 x.direction=rtl?"rtl":"ltr";x.fillStyle="#fff";x.fillRect(0,0,W,c.height);gr.addColorStop(0,"#0e7c66");gr.addColorStop(1,"#2bb08f");x.fillStyle=gr;x.fillRect(0,0,W,150);
 const T=(s,px,y,col,e,wt)=>{x.font=`${wt||""} ${px}px ${F}`;x.fillStyle=col;x.textAlign=(e?!rtl:rtl)?"right":"left";x.fillText(s,e?E:R,y)};
 T("🛒 "+l.n,40,66,"#fff",0,"800");T((l.dt||"")+"  –  "+t("app"),24,112,"#d5ece5",0);
 let y=200;rows.forEach(([h,v])=>{if(h){y+=14;T(v[1]+" "+nm(v[2]),26,y,v[3],0,"800")}else{T((v.k?"✓ ":"○ ")+v.n+(v.q>1?" ×"+v.q:""),25,y,"#12262b",0);if(v.pr)T(fmt(v.pr,v.pc),24,y,"#5d7076",1)}y+=46});
 y+=10;x.fillStyle="#d5ece5";x.fillRect(24,y-24,W-48,64);T(t("total"),28,y+18,"#0e7c66",0,"800");T(fmt(sum(it),D.set.base),28,y+18,"#0e7c66",1,"800");
 return c};
const shot=id=>{V.exp=null;V.cv=mk(id);V.img=V.cv.toDataURL();draw()};
const cardV=()=>`<div class="ov" onclick="if(event.target===this){V.img=null;draw()}"><div class="sheet" style="max-height:92vh;overflow:auto;text-align:center"><img src="${V.img}" alt="card" style="width:100%;border-radius:12px"><div class="fl"><button class="btn" onclick="dl()">${t("dl")}</button><button class="btn alt" onclick="sh()">${t("shr")}</button></div><p class="mute">${t("hold")}</p><button class="btn alt" onclick="V.img=null;draw()">${t("close")}</button></div></div>`;
const dl=()=>{const a=document.createElement("a");a.href=V.img;a.download="salati.png";a.click()};
const sh=()=>V.cv.toBlob(b=>{const f=new File([b],"salati.png",{type:"image/png"});navigator.canShare&&navigator.canShare({files:[f]})?navigator.share({files:[f]}).catch(()=>{}):dl()});
/* قوالب */
const TPL=[["🍳","سلة فطور|Breakfast basket","خبز,جبنة,لبنة,زيتون,بيض,حليب,شاي|bread,cheese,labneh,olives,eggs,milk,tea"],["🥬","خضار وفواكه|Fruit and veg","بندورة,خيار,بطاطا,بصل,ثوم,ليمون,تفاح,موز|tomatoes,cucumbers,potatoes,onions,garlic,lemons,apples,bananas"],["🛒","مشتريات أسبوعية|Weekly shop","خبز,رز,سكر,زيت,حليب,بيض,دجاج,صابون|bread,rice,sugar,oil,milk,eggs,chicken,soap"]];
const tpl=i=>{const p=TPL[i],a=p[2].split("|")[0].split(","),b=p[2].split("|")[+en()].split(","),id=uid();act(()=>{D.lists.push({id,n:nm(p[1]),dt:today(),u:Date.now()});b.forEach((n,k)=>D.items.push({id:uid(),l:id,n,q:1,c:guess(a[k]),k:0,u:Date.now()}))});go("lists",id)};
const dayTag=d=>d===today()?` <b class="tag">${t("today")}</b>`:d===ymd(new Date(Date.now()+864e5))?` <b class="tag">${t("tomorrow")}</b>`:"";
/* مقارنة السعر */
const cmp=(a,b,p,s)=>{const d=(a-b)/b*100;return Math.abs(d)<1?"":`<span style="color:${d>0?"var(--bad)":"#1b8a4b"};font-weight:800">${d>0?"▲":"▼"} ${Math.abs(d).toFixed(0)}%</span>${p.st&&p.st!==s?" ("+esc(p.st)+")":""}`};
const diff=i=>{const p=i.pr&&lastP(i.n,i.id),a=p&&conv(i.pr,i.pc,D.set.base),b=p&&conv(p.pr,p.pc,D.set.base);return a&&b?cmp(a,b,p,i.st):""};
const pd=id=>{const i=find(D.items,id),p=lastP(i.n,id),a=conv(parseFloat($("pa").value),$("pc").value,D.set.base),b=p&&conv(p.pr,p.pc,D.set.base);$("pd").innerHTML=a>0&&b?cmp(a,b,p,$("ps").value.trim()):""};
/* الإدخال الصوتي */
const mic=l=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast(t("noMic"));const r=new R(),N={واحد:1,اثنين:2,اثنان:2,ثنتين:2,ثلاثة:3,ثلاث:3,أربعة:4,خمسة:5};r.lang=en()?"en-US":"ar-SA";
 r.onresult=e=>{const a=e.results[0][0].transcript.split(/[,،]| و /).map(x=>x.trim()).filter(Boolean).map(x=>{let q=1;x=x.replace(/\d+/,m=>(q=+m,"")).split(" ").filter(w=>N[w]?(q=N[w],0):w).join(" ").trim();return{n:x,q}}).filter(x=>x.n);act(()=>a.forEach(x=>D.items.push({id:uid(),l,n:x.n,q:x.q,c:guess(x.n),k:0,u:Date.now()})),t("added"))};r.onerror=()=>toast(t("noMic"));r.start();toast(t("listen"))};
/* وضع السوق */
const shopV=()=>{const it=items(V.shop),open=it.filter(i=>!i.k);return `<div class="shop"><div class="stats"><span>${t("remaining")}<b>${open.length}</b></span><span>${t("spent")}<b>${fmt(sum(it),D.set.base)}</b></span><button class="btn alt" onclick="V.shop=null;draw()">${t("close")}</button></div>`+(open.length?open.map(i=>`<button class="big" onclick="V.sheet='${i.id}';draw()"><span class="bc"></span><span>${esc(i.n)}${i.q>1?" ×"+i.q:""}<br><small>${(p=>p?t("last")+": "+fmt(p.pr,p.pc):"")(lastP(i.n,i.id))}</small></span></button>`).join(""):`<div class="box" style="text-align:center;font-size:24px">${t("finish")}</div>`)+"</div>"};
/* التصدير: PNG / PDF / Excel */
const dl2=(b,n)=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
const expV=()=>`<div class="ov" onclick="if(event.target===this){V.exp=null;draw()}"><div class="sheet"><b>${t("export")}</b>${[["🖼️","PNG",`shot('${V.exp}')`,"expPng"],["📄","PDF",`outPdf('${V.exp}')`,"expPdf"],["📊","Excel",`outCsv('${V.exp}')`,"expXls"]].map(([e,n,f,k])=>`<button class="row" onclick="${f}"><span class="cs">${e}</span><span><b>${n}</b><br><span class="mute">${t(k)}</span></span></button>`).join("")}<button class="btn alt" style="width:100%" onclick="V.exp=null;draw()">${t("close")}</button></div></div>`;
function pdfBlob(c){const j=atob(c.toDataURL("image/jpeg",.92).split(",")[1]),w=c.width,h=c.height,off=[];let s="%PDF-1.4\n";const ob=x=>{off.push(s.length);s+=off.length+" 0 obj\n"+x+"\nendobj\n"};
 ob("<</Type/Catalog/Pages 2 0 R>>");ob("<</Type/Pages/Kids[3 0 R]/Count 1>>");ob(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${w} ${h}]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>`);
 ob(`<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.length}>>\nstream\n${j}\nendstream`);const k=`q ${w} 0 0 ${h} 0 0 cm /I Do Q`;ob(`<</Length ${k.length}>>\nstream\n${k}\nendstream`);
 const x=s.length;s+="xref\n0 6\n0000000000 65535 f \n"+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;return new Blob([Uint8Array.from(s,ch=>ch.charCodeAt(0))],{type:"application/pdf"})}
const outPdf=id=>{dl2(pdfBlob(mk(id)),"salati-"+find(D.lists,id).dt+".pdf");V.exp=null;draw()};
const outCsv=id=>{const l=find(D.lists,id),q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',H=en()?["Category","Item","Qty","Price","Currency","Store","Date","Bought"]:["التصنيف","الغرض","الكمية","السعر","العملة","المحل","التاريخ","تم الشراء"],
 r=items(id).map(i=>[nm((CATS.find(c=>c[0]===i.c)||CATS[8])[2]),i.n,i.q,i.pr,i.pc,i.st,l.dt,i.k?"✓":""]);
 dl2(new Blob(["\ufeff"+[H,...r].map(a=>a.map(q).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),"salati-"+l.dt+".csv");V.exp=null;draw()};
/* نسخة احتياطية */
const backup=()=>dl2(new Blob([JSON.stringify(D)],{type:"application/json"}),"salati-backup-"+today()+".json");
const restore=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.lists))throw 0;act(()=>{D=Object.assign(D,o);D.set=Object.assign({lang:"ar",base:"SYP",rates:{USD:1}},o.set)},t("restored"))}catch(e){toast(t("badFile"))}};r.readAsText(f)};
const bkV=()=>`<div class="box"><b>${t("bk")}</b><div class="fl"><button class="btn" onclick="backup()">${t("bkSave")}</button><button class="btn alt" onclick="$('rf').click()">${t("bkRest")}</button></div><input id="rf" type="file" accept=".json,application/json" hidden onchange="restore(this.files[0])"><p class="mute">${t("bkNote")}</p></div>`;
const welcomeV=()=>`<div class="hero" style="text-align:center;padding:36px 16px"><div style="font-size:64px">🛒</div><h1 style="font-size:34px">${t("app")}</h1><div>${t("wSub")}</div></div>${[["📋","w1"],["💰","w2"],["📤","w3"]].map(([e,k])=>`<div class="box rep"><span class="cs">${e}</span><span style="flex:1">${t(k)}</span></div>`).join("")}<button class="btn" style="width:100%;min-height:58px;font-size:20px" onclick="D.set.welcomed=1;save();burst(innerWidth/2,innerHeight/3,90);draw()">${t("start")}</button>`;
draw();
setTimeout(()=>burst(innerWidth/2,innerHeight/2,80),900);
setTimeout(()=>$("splash").className="off",1800);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
